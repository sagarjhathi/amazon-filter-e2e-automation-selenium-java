name: CI Pipeline 

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: "50 17 * * *"   # 11:20 PM IST daily

permissions:
  contents: write   # ✅ allow pushing index.html back to repo

env:
  JAVA_DISTRIBUTION: temurin
  JAVA_VERSION: 24
  WORKDIR: eclipse-workspace/Intro
  ARTIFACT_RETENTION_DAYS: 7

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false   # one shard failing shouldn't cancel the other two
      matrix:
        group: [BatteryProcessorStorage, BrandsScreenSizeTypeCamEtc, DeliveryPriceOs]
    env:
      REPORT_BASE: "/amazon-filter-e2e-automation/"
      IS_CRON: ${{ github.event_name == 'schedule' }} # <-- "true" only for cron
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true   # ✅ ensures GITHUB_TOKEN is kept for pushing

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Cache Maven target and .m2 repo (optional)
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ${{ env.WORKDIR }}/target
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Print environment info
        shell: bash
        run: |
          echo "Java version:"
          java -version
          echo "Maven version:"
          mvn -v
          echo "Working directory: ${{ env.WORKDIR }}"
          echo "Runner OS: $RUNNER_OS"

      - name: Notify Discord – Start of Test
        if: always()
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          runUrl="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          timestamp=$(TZ='Asia/Kolkata' date +"%Y-%m-%d %I:%M %p IST")
          actor="${{ github.actor }}"
          branch="${{ github.ref_name }}"
          job_name="${{ github.job }}"

          curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"**CI Test Started - $job_name**\\n Triggered by: $actor\\n Branch: $branch\\n Start Time: $timestamp\\n [View Run]($runUrl)\"}" "$DISCORD_WEBHOOK"


      - name: Set RUN_TIMESTAMP (Windows runner)
        id: set_ts
        shell: pwsh
        run: |
          # produce format yyyy-MM-dd_HH-mm-ss (matches local format)
          $ts = Get-Date -Format 'yyyy-MM-dd_HH-mm-ss'
          Write-Host "RUN_TIMESTAMP = $ts"
          # export to GITHUB_ENV for subsequent steps
          Add-Content -Path $env:GITHUB_ENV -Value "RUN_TIMESTAMP=$ts"


      - name: Build project
        run: mvn clean compile
        working-directory: ${{ env.WORKDIR }}


      - name: Run Maven Tests
        working-directory: ${{ env.WORKDIR }}
        run: mvn test -Dgroups=${{ matrix.group }}
        continue-on-error: true
       

      - name: Find latest run folder
        id: find_run
        shell: pwsh
        run: |
          $runFolder = Get-ChildItem -Path "${{ env.WORKDIR }}" -Directory -Filter "run_*" |
                       Sort-Object LastWriteTime -Descending |
                       Select-Object -First 1
      
          echo "RUN_FOLDER=$($runFolder.Name)" >> $env:GITHUB_ENV


      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extent-${{ matrix.group }}
          path: ${{ env.WORKDIR }}/${{ env.RUN_FOLDER }}
          retention-days: 30


      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.group }}
          path: ${{ env.WORKDIR }}/target/allure-results
          if-no-files-found: warn


  publish:
    needs: test
    if: always()
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Set RUN_TIMESTAMP (Windows runner)
        shell: pwsh
        run: |
          $ts = Get-Date -Format 'yyyy-MM-dd_HH-mm-ss'
          Add-Content -Path $env:GITHUB_ENV -Value "RUN_TIMESTAMP=$ts"

      - name: Download BatteryProcessorStorage report
        uses: actions/download-artifact@v4
        with:
          name: extent-BatteryProcessorStorage
          path: shards/BatteryProcessorStorage

      - name: Download BrandsScreenSizeTypeCamEtc report
        uses: actions/download-artifact@v4
        with:
          name: extent-BrandsScreenSizeTypeCamEtc
          path: shards/BrandsScreenSizeTypeCamEtc

      - name: Download DeliveryPriceOs report
        uses: actions/download-artifact@v4
        with:
          name: extent-DeliveryPriceOs
          path: shards/DeliveryPriceOs

      - name: Download BatteryProcessorStorage allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-BatteryProcessorStorage
          path: allure-results/BatteryProcessorStorage

      - name: Download BrandsScreenSizeTypeCamEtc allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-BrandsScreenSizeTypeCamEtc
          path: allure-results/BrandsScreenSizeTypeCamEtc

      - name: Download DeliveryPriceOs allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-DeliveryPriceOs
          path: allure-results/DeliveryPriceOs

      - name: Set up Node (for Allure CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate merged Allure report
        run: |
          npm install -g allure-commandline
          allure generate allure-results/BatteryProcessorStorage allure-results/BrandsScreenSizeTypeCamEtc allure-results/DeliveryPriceOs --clean --report-name "Amazon Filter E2E - Selenium + Java Report" -o allure-report

      # Same merged report as ONE self-contained html file, downloadable from the run's Artifacts section.
      - name: Generate single-file merged Allure report
        run: allure generate allure-results/BatteryProcessorStorage allure-results/BrandsScreenSizeTypeCamEtc allure-results/DeliveryPriceOs --clean --single-file --report-name "Amazon Filter E2E - Selenium + Java Report" -o allure-report-single

      - name: Upload merged Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-merged
          path: allure-report-single
          retention-days: 30

      - name: Enable long paths (Windows)
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          clean: false
          ref: gh-pages
          path: gh-pages


      - name: Clean gh-pages
        shell: pwsh
        run: |
          Get-ChildItem -Path gh-pages -Force | Where-Object { $_.Name -ne '.git' } | Remove-Item -Recurse -Force


      - name: Assemble published site
        shell: pwsh
        run: |
          $run = "run_$env:RUN_TIMESTAMP"
          $runPath = "gh-pages/$run"
          New-Item -ItemType Directory -Path $runPath -Force | Out-Null

          # Each shard's reports/logs/screenshots folder is moved as a whole, untouched -
          # its ExtentReport.html uses ../logs and ../screenshots relative links, so the
          # three subfolders inside it must stay exactly as the shard produced them.
          Copy-Item -Recurse -Force "shards/BatteryProcessorStorage" "$runPath/BatteryProcessorStorage"
          Copy-Item -Recurse -Force "shards/BrandsScreenSizeTypeCamEtc" "$runPath/BrandsScreenSizeTypeCamEtc"
          Copy-Item -Recurse -Force "shards/DeliveryPriceOs" "$runPath/DeliveryPriceOs"
          Copy-Item -Recurse -Force "allure-report" "$runPath/allure-report"

          $indexPath = "gh-pages/index.html"
          $lines = @(
            '<!DOCTYPE html>'
            '<html lang="en">'
            '<head>'
            '<meta charset="UTF-8">'
            '<meta name="viewport" content="width=device-width, initial-scale=1">'
            '<title>Selenium + Java Test Report Hub</title>'
            '<style>'
            '  body { margin:0; padding:48px 20px; background:#f5f6f8;'
            '         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;'
            '         color:#1a1a2e; }'
            '  .container { max-width:680px; margin:0 auto; }'
            '  h1 { font-size:24px; margin:0 0 4px 0; }'
            '  .subtitle { color:#6b7280; font-size:14px; margin-bottom:32px; }'
            '  .card { display:block; background:#ffffff; border:1px solid #e5e7eb; border-radius:10px;'
            '          padding:18px 20px; margin-bottom:12px; text-decoration:none; color:inherit;'
            '          transition:box-shadow .15s ease, border-color .15s ease; }'
            '  .card:hover { box-shadow:0 4px 14px rgba(0,0,0,.08); border-color:#c7d2fe; }'
            '  .card-title { font-size:16px; font-weight:600; margin-bottom:4px; }'
            '  .card-desc { font-size:13px; color:#6b7280; }'
            '  .badge { display:inline-block; font-size:11px; font-weight:600; color:#4338ca;'
            '           background:#eef2ff; border-radius:999px; padding:2px 10px; margin-bottom:8px; }'
            '</style>'
            '</head>'
            '<body>'
            '<div class="container">'
            '<h1>Amazon Filter E2E - Selenium + Java Test Report Hub</h1>'
            "<div class='subtitle'>Run: $run</div>"

            "<a class='card' href='$run/allure-report/index.html'>"
            '<span class="badge">MERGED</span>'
            '<div class="card-title">Allure report</div>'
            '<div class="card-desc">All 3 shards combined in one dashboard</div>'
            '</a>'

            "<a class='card' href='$run/BatteryProcessorStorage/reports/ExtentReport.html'>"
            '<div class="card-title">Battery / Processor / Storage / Discount</div>'
            '<div class="card-desc">Extent report for this shard</div>'
            '</a>'

            "<a class='card' href='$run/BrandsScreenSizeTypeCamEtc/reports/ExtentReport.html'>"
            '<div class="card-title">Brands / Screen Size / Display Type / Camera</div>'
            '<div class="card-desc">Extent report for this shard</div>'
            '</a>'

            "<a class='card' href='$run/DeliveryPriceOs/reports/ExtentReport.html'>"
            '<div class="card-title">Delivery / Price / OS Version</div>'
            '<div class="card-desc">Extent report for this shard</div>'
            '</a>'

            '</div>'
            '</body>'
            '</html>'
          )
          Set-Content -Path $indexPath -Value $lines


      - name: Deploy
        shell: pwsh
        working-directory: gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Reset gh-pages to a single fresh commit each run instead of committing on top
          # of prior history - otherwise every run's report/screenshots pile up forever
          # even though only the latest commit is ever actually served.
          git checkout --orphan gh-pages-deploy
          git add -A
          git commit -m "Update report"
          git push origin gh-pages-deploy:gh-pages --force

      - name: Notify Discord – End of Test
        if: always()
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          runUrl="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          status="${{ needs.test.result }}"

          if [ "$status" = "success" ]; then
            status_emoji="✅"
          elif [ "$status" = "failure" ]; then
            status_emoji="❌"
          else
            status_emoji="⚠️"
          fi

          commit_short="${GITHUB_SHA:0:7}"
          timestamp=$(TZ='Asia/Kolkata' date +"%Y-%m-%d %I:%M %p IST")
          pagesUrl="https://sagarjhathi.github.io/amazon-filter-e2e-automation/"

          curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"$status_emoji **CI Pipeline** (${{ github.ref_name }}): tests $status\n Triggered by: ${{ github.actor }}\n Commit: \`$commit_short\`\n Completed at: $timestamp\n [View Full Run Details]($runUrl)\n [Open Latest Report on GitHub Pages]($pagesUrl)\"}" "$DISCORD_WEBHOOK"
