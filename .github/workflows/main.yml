name: CI Pipeline 

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: "50 17 * * *"   # 11:20 PM IST daily

permissions:
  contents: write   # ✅ allow pushing index.html back to repo

env:
  JAVA_DISTRIBUTION: temurin
  JAVA_VERSION: 24
  WORKDIR: eclipse-workspace/Intro
  ARTIFACT_RETENTION_DAYS: 7

jobs:
  # Runs once, so a compile error or a broken unit test stops the run before the browsers start. Opens no Amazon page.
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compile main and test code
        run: mvn -q test-compile
        working-directory: ${{ env.WORKDIR }}

      # The unit suite: no browser. (The project has no lint or style tool in pom.xml, so there is nothing to run for that.)
      - name: Unit tests
        run: mvn -q test "-Dsurefire.suiteXmlFiles=src/test/runners/UnitTests.xml"
        working-directory: ${{ env.WORKDIR }}

  # One job per TestNG group (a third of the main suite each).
  test:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false   # one shard failing shouldn't cancel the other two
      matrix:
        group: [BatteryProcessorStorage, BrandsScreenSizeTypeCamEtc, DeliveryPriceOs]
    env:
      REPORT_BASE: "/amazon-filter-e2e-automation/"
      IS_CRON: ${{ github.event_name == 'schedule' }} # <-- "true" only for cron
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true   # ✅ ensures GITHUB_TOKEN is kept for pushing

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Cache Maven target and .m2 repo (optional)
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ${{ env.WORKDIR }}/target
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Print environment info
        shell: bash
        run: |
          echo "Java version:"
          java -version
          echo "Maven version:"
          mvn -v
          echo "Working directory: ${{ env.WORKDIR }}"
          echo "Runner OS: $RUNNER_OS"

      - name: Notify Discord – Start of Test
        if: always()
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          runUrl="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          timestamp=$(TZ='Asia/Kolkata' date +"%Y-%m-%d %I:%M %p IST")
          actor="${{ github.actor }}"
          branch="${{ github.ref_name }}"
          job_name="${{ github.job }}"

          curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"**CI Test Started - $job_name**\\n Triggered by: $actor\\n Branch: $branch\\n Start Time: $timestamp\\n [View Run]($runUrl)\"}" "$DISCORD_WEBHOOK"


      - name: Set RUN_TIMESTAMP (Windows runner)
        id: set_ts
        shell: pwsh
        run: |
          # produce format yyyy-MM-dd_HH-mm-ss (matches local format)
          $ts = Get-Date -Format 'yyyy-MM-dd_HH-mm-ss'
          Write-Host "RUN_TIMESTAMP = $ts"
          # export to GITHUB_ENV for subsequent steps
          Add-Content -Path $env:GITHUB_ENV -Value "RUN_TIMESTAMP=$ts"


      - name: Build project
        run: mvn clean compile
        working-directory: ${{ env.WORKDIR }}


      - name: Run Maven Tests
        working-directory: ${{ env.WORKDIR }}
        run: mvn test -Dgroups=${{ matrix.group }}
        continue-on-error: true
       

      - name: Find latest run folder
        id: find_run
        shell: pwsh
        run: |
          $runFolder = Get-ChildItem -Path "${{ env.WORKDIR }}" -Directory -Filter "run_*" |
                       Sort-Object LastWriteTime -Descending |
                       Select-Object -First 1
      
          echo "RUN_FOLDER=$($runFolder.Name)" >> $env:GITHUB_ENV


      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extent-${{ matrix.group }}
          path: ${{ env.WORKDIR }}/${{ env.RUN_FOLDER }}
          retention-days: 30


      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.group }}
          path: ${{ env.WORKDIR }}/target/allure-results
          if-no-files-found: warn


  # Merges the group reports into one Allure report and publishes everything to the gh-pages branch (GitHub Pages).
  # It replaces ONLY allure/, extent/, run-info.txt and index.html there; card-checks.yml publishes card-checks/ and index.html.
  # Pull requests build the merged Allure report (downloadable below) but publish nothing.
  publish:
    needs: test
    # Still runs when a group failed; skipped only when the tests never ran (for example a compile error in check).
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: windows-latest
    timeout-minutes: 60
    # contents: write is needed to push to gh-pages; actions: write to delete the per-group artifacts afterwards.
    permissions:
      contents: write
      actions: write
    # Only one publish at a time (the same group as card-checks.yml), so two runs never push to gh-pages together.
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    steps:
      # The landing page (.github/pages/index.html) is copied from here.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download BatteryProcessorStorage report
        uses: actions/download-artifact@v4
        with:
          name: extent-BatteryProcessorStorage
          path: shards/BatteryProcessorStorage

      - name: Download BrandsScreenSizeTypeCamEtc report
        uses: actions/download-artifact@v4
        with:
          name: extent-BrandsScreenSizeTypeCamEtc
          path: shards/BrandsScreenSizeTypeCamEtc

      - name: Download DeliveryPriceOs report
        uses: actions/download-artifact@v4
        with:
          name: extent-DeliveryPriceOs
          path: shards/DeliveryPriceOs

      - name: Download BatteryProcessorStorage allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-BatteryProcessorStorage
          path: allure-results/BatteryProcessorStorage

      - name: Download BrandsScreenSizeTypeCamEtc allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-BrandsScreenSizeTypeCamEtc
          path: allure-results/BrandsScreenSizeTypeCamEtc

      - name: Download DeliveryPriceOs allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-DeliveryPriceOs
          path: allure-results/DeliveryPriceOs

      - name: Enable long paths (Windows)
        shell: pwsh
        run: git config --global core.longpaths true

      # Not on pull requests (they publish nothing). Checked out before the Allure report is built:
      # the report published last time keeps its history on it, for the trend graphs.
      - name: Checkout gh-pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@v4
        with:
          clean: false
          ref: gh-pages
          path: gh-pages

      - name: Set up Node (for Allure CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Carries the trend history forward: allure/history on the branch. It is put into one of the results folders;
      # allure reads it from there. The first time (and on pull requests) there is none, so nothing is copied.
      - name: Copy previous Allure history (for trend graphs)
        shell: pwsh
        run: |
          if (Test-Path gh-pages/allure/history) {
            Copy-Item -Recurse gh-pages/allure/history allure-results/BatteryProcessorStorage/history
          }

      - name: Generate merged Allure report
        run: |
          npm install -g allure-commandline
          allure generate allure-results/BatteryProcessorStorage allure-results/BrandsScreenSizeTypeCamEtc allure-results/DeliveryPriceOs --clean --report-name "Amazon Filter E2E - Selenium + Java Report" -o allure-report

      # Same merged report as ONE self-contained html file, downloadable from the run's Artifacts section.
      - name: Generate single-file merged Allure report
        run: allure generate allure-results/BatteryProcessorStorage allure-results/BrandsScreenSizeTypeCamEtc allure-results/DeliveryPriceOs --clean --single-file --report-name "Amazon Filter E2E - Selenium + Java Report" -o allure-report-single

      - name: Upload merged Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-merged
          path: allure-report-single
          retention-days: 30

      # ---- Publish (not on pull requests) ----

      # TEMPORARY: the old layout published a run_<timestamp> folder per run at the root of the branch.
      # Delete this step after the first successful run on the new layout: no run_* folder is left by then.
      - name: Remove the old run_* folders
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        run: Get-ChildItem -Path gh-pages -Directory -Filter 'run_*' | Remove-Item -Recurse -Force

      # Replaces ONLY allure/, extent/, run-info.txt and index.html on the branch; card-checks/ is left as it is.
      # Each group's run folder is copied whole, untouched: its ExtentReport.html uses ../logs and ../screenshots relative links.
      - name: Assemble published site
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue gh-pages/allure, gh-pages/extent, gh-pages/run-info.txt
          New-Item -ItemType Directory -Path gh-pages/extent | Out-Null

          Copy-Item -Recurse "shards/BatteryProcessorStorage" "gh-pages/extent/BatteryProcessorStorage"
          Copy-Item -Recurse "shards/BrandsScreenSizeTypeCamEtc" "gh-pages/extent/BrandsScreenSizeTypeCamEtc"
          Copy-Item -Recurse "shards/DeliveryPriceOs" "gh-pages/extent/DeliveryPriceOs"
          Copy-Item -Recurse "allure-report" "gh-pages/allure"

          # The landing page reads this line to show which run the CI Pipeline reports are from.
          $when = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')
          "Run #$env:GITHUB_RUN_NUMBER - commit $($env:GITHUB_SHA.Substring(0,7)) - $when UTC" | Set-Content -Path gh-pages/run-info.txt

          # The same landing page file is used by card-checks.yml, so whichever workflow ran last leaves a page with both sections.
          Copy-Item .github/pages/index.html gh-pages/index.html -Force
          if (-not (Test-Path gh-pages/.nojekyll)) { New-Item -ItemType File -Path gh-pages/.nojekyll | Out-Null }

      - name: Deploy
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        working-directory: gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Reset gh-pages to a single fresh commit each run instead of committing on top
          # of prior history - otherwise every run's report/screenshots pile up forever
          # even though only the latest commit is ever actually served.
          git checkout --orphan gh-pages-deploy
          git add -A
          git commit -m "Update report"
          git push origin gh-pages-deploy:gh-pages --force

      # The per-group artifacts only exist to feed this job; the published site holds the reports. If any step above
      # failed, this step is skipped and they stay, so the job can be re-run without re-running the tests.
      - name: Delete the per-group artifacts
        if: ${{ success() && github.event_name != 'pull_request' }}
        continue-on-error: true   # cleanup only: a failure here must not fail the run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | test("^(extent|allure-results)-[A-Za-z]+$")) | .id' |
            xargs -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}"

      - name: Notify Discord – End of Test
        if: always()
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          runUrl="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          status="${{ needs.test.result }}"

          if [ "$status" = "success" ]; then
            status_emoji="✅"
          elif [ "$status" = "failure" ]; then
            status_emoji="❌"
          else
            status_emoji="⚠️"
          fi

          commit_short="${GITHUB_SHA:0:7}"
          timestamp=$(TZ='Asia/Kolkata' date +"%Y-%m-%d %I:%M %p IST")
          pagesUrl="https://sagarjhathi.github.io/amazon-filter-e2e-automation/"

          curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"$status_emoji **CI Pipeline** (${{ github.ref_name }}): tests $status\n Triggered by: ${{ github.actor }}\n Commit: \`$commit_short\`\n Completed at: $timestamp\n [View Full Run Details]($runUrl)\n [Open Latest Report on GitHub Pages]($pagesUrl)\"}" "$DISCORD_WEBHOOK"
